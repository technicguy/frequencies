<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonanz | Reverse Cymatics Explorer</title>
    <meta name="description"
        content="Translate visual patterns into resonant sound frequencies using physics-based cymatic modeling.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05070a;
            --bg-card: rgba(15, 20, 30, 0.7);
            --accent-blue: #00d2ff;
            --accent-cyan: #00fff2;
            --accent-purple: #7000ff;
            --text-primary: #e0e6ed;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(12px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at 50% 50%, #1a2333 0%, #05070a 100%);
        }

        .glow-overlay {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 210, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .main-header {
            height: 60px;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: rgba(5, 7, 10, 0.8);
            backdrop-filter: var(--glass-blur);
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 1.5rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .logo h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 4px;
            font-weight: 500;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 255, 242, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 255, 242, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Workspace Layout */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 1px;
            background: var(--border-color);
        }

        .sidebar {
            background: var(--bg-dark);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            z-index: 5;
        }

        .sidebar h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-field label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        select,
        input[type="number"] {
            background: #151921;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--accent-blue);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-blue);
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-tool {
            aspect-ratio: 1/1;
            background: #151921;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .btn-tool.active {
            background: rgba(0, 210, 255, 0.2);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
        }

        /* Canvas Area */
        .canvas-container {
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #main-canvas {
            cursor: crosshair;
            box-shadow: 0 0 100px rgba(0, 210, 255, 0.05);
        }

        .canvas-overlay {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            pointer-events: none;
        }

        .indicator {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: var(--glass-blur);
            padding: 8px 16px;
            border-radius: 4px;
            border-left: 3px solid var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent-cyan);
        }

        /* Result Section */
        .result-card {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.1) 0%, transparent 100%);
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 1.5rem;
            border-radius: 12px;
        }

        .frequency-display {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-top: 0.5rem;
        }

        #freq-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(0, 255, 242, 0.3);
        }

        .unit {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        /* Buttons */
        .audio-controls {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-play {
            background: transparent;
            border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-play:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--text-secondary);
            color: var(--text-secondary);
        }

        .btn-play:not(:disabled):hover {
            background: var(--accent-cyan);
            color: #000;
        }

        /* Spectrum Viz */
        .spectrum-visualizer {
            height: 120px;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .spectrum-bar {
            flex: 1;
            background: var(--accent-blue);
            min-height: 2px;
            transition: height 0.3s ease;
        }

        /* Footer */
        .main-footer {
            height: 40px;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--bg-dark);
            border-top: 1px solid var(--border-color);
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div id="app" class="app-container">
        <!-- Background Ambient Effect -->
        <div class="glow-overlay"></div>

        <header class="main-header">
            <div class="logo">
                <span class="logo-icon">◈</span>
                <h1>RESONANZ</h1>
            </div>
            <div class="status-badge" id="app-status">Ready</div>
        </header>

        <main class="workspace">
            <!-- Left Sidebar: Controls -->
            <aside class="sidebar left">
                <section class="control-group">
                    <h3>Plate Parameters</h3>
                    <div class="input-field">
                        <label for="material">Material</label>
                        <select id="material">
                            <option value="brass">Brass (Polished)</option>
                            <option value="steel">Stainless Steel</option>
                            <option value="water">Liquid (Water Surface)</option>
                            <option value="rubber">Membrane (Rubber)</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label for="plate-shape">Plate Shape</label>
                        <select id="plate-shape">
                            <option value="circular">Circular</option>
                            <option value="square">Square</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label>Size / Tension</label>
                        <input type="range" id="plate-size" min="10" max="100" value="50">
                        <div class="range-labels">
                            <span>10cm</span>
                            <span>100cm</span>
                        </div>
                    </div>
                </section>

                <section class="control-group">
                    <h3>Pattern Tools</h3>
                    <div class="btn-grid">
                        <button id="tool-draw" class="btn-tool active" title="Draw Pattern">✎</button>
                        <button id="tool-symmetry" class="btn-tool active" title="Toggle Radial Symmetry">❂</button>
                        <button id="tool-clear" class="btn-tool" title="Clear Canvas">⟲</button>
                    </div>
                    <div class="symmetry-count">
                        <label>Symmetry Points</label>
                        <input type="number" id="symmetry-points" value="6" min="1" max="24">
                    </div>
                </section>

                <section class="audio-controls">
                    <button id="btn-calculate" class="btn-primary">Calculate Resonance</button>
                    <button id="btn-play" class="btn-play" disabled>
                        <span class="icon">▶</span> Play Tone
                    </button>
                </section>
            </aside>

            <!-- Center: The Canvas -->
            <div class="canvas-container">
                <canvas id="main-canvas"></canvas>
                <div class="canvas-overlay">
                    <div class="indicator" id="detected-mode">Mode: Pending Analysis</div>
                </div>
            </div>

            <!-- Right Sidebar: Results & Analytics -->
            <aside class="sidebar right">
                <section class="result-card">
                    <h3>Calculated Frequency</h3>
                    <div class="frequency-display">
                        <span id="freq-value">0.00</span>
                        <span class="unit">Hz</span>
                    </div>
                </section>

                <section class="analytics">
                    <h3>Harmonic Spectrum</h3>
                    <div class="spectrum-visualizer" id="spectrum-viz">
                        <!-- JS will inject spectrum bars here -->
                    </div>
                </section>

                <section class="history">
                    <h3>Research Log</h3>
                    <div class="log-list" id="research-log">
                        <p class="empty-msg">No frequencies cached yet.</p>
                    </div>
                </section>
            </aside>
        </main>

        <footer class="main-footer">
            <p>&copy; 2026 Resonanz Research Division | Advanced Wave Mechanics</p>
        </footer>
    </div>

    <script>
        class CymaticsApp {
            constructor() {
                this.initElements();
                this.initCanvas();
                this.initAudio();
                this.bindEvents();

                // App State
                this.state = {
                    drawing: false,
                    tool: 'draw',
                    symmetry: true,
                    symmetryPoints: 6,
                    plateShape: 'circular',
                    material: 'brass',
                    plateSize: 50, // cm
                    calculatedFreq: 0,
                    isPlaying: false
                };

                this.history = [];
                this.animate();
            }

            initElements() {
                this.canvas = document.getElementById('main-canvas');
                this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
                this.freqDisplay = document.getElementById('freq-value');
                this.modeIndicator = document.getElementById('detected-mode');
                this.btnPlay = document.getElementById('btn-play');
                this.btnCalculate = document.getElementById('btn-calculate');
                this.statusBadge = document.getElementById('app-status');
                this.spectrumViz = document.getElementById('spectrum-viz');

                // Inputs
                this.materialSelect = document.getElementById('material');
                this.shapeSelect = document.getElementById('plate-shape');
                this.sizeRange = document.getElementById('plate-size');
                this.symmetryInput = document.getElementById('symmetry-points');
            }

            initCanvas() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                // Set initial styles
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
            }

            resizeCanvas() {
                const container = this.canvas.parentElement;
                this.canvas.width = container.clientWidth - 80;
                this.canvas.height = container.clientHeight - 80;
                this.clearCanvas();
            }

            initAudio() {
                this.audioCtx = null;
                this.oscillator = null;
                this.gainNode = null;
            }

            bindEvents() {
                // Drawing Events
                this.canvas.addEventListener('mousedown', (e) => this.startDrawing(e));
                this.canvas.addEventListener('mousemove', (e) => this.draw(e));
                this.canvas.addEventListener('mouseup', () => this.stopDrawing());
                this.canvas.addEventListener('mouseleave', () => this.stopDrawing());

                // Control Events
                document.getElementById('tool-clear').addEventListener('click', () => this.clearCanvas());
                const symBtn = document.getElementById('tool-symmetry');
                symBtn.addEventListener('click', (e) => {
                    this.state.symmetry = !this.state.symmetry;
                    e.currentTarget.classList.toggle('active', this.state.symmetry);
                });

                this.btnCalculate.addEventListener('click', () => this.processPattern());
                this.btnPlay.addEventListener('click', () => this.togglePlayback());

                // State Sync
                this.materialSelect.addEventListener('change', (e) => this.state.material = e.target.value);
                this.shapeSelect.addEventListener('change', (e) => this.state.plateShape = e.target.value);
                this.sizeRange.addEventListener('input', (e) => this.state.plateSize = parseInt(e.target.value));
                this.symmetryInput.addEventListener('change', (e) => this.state.symmetryPoints = parseInt(e.target.value));
            }

            // --- Drawing Logic ---

            clearCanvas() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw centered guideline
                this.ctx.strokeStyle = 'rgba(0, 210, 255, 0.05)';
                this.ctx.beginPath();
                this.ctx.arc(this.canvas.width / 2, this.canvas.height / 2, Math.min(this.canvas.width, this.canvas.height) * 0.4, 0, Math.PI * 2);
                this.ctx.stroke();
            }

            startDrawing(e) {
                this.state.drawing = true;
                this.draw(e);
            }

            stopDrawing() {
                this.state.drawing = false;
                this.ctx.beginPath();
            }

            draw(e) {
                if (!this.state.drawing) return;

                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;

                this.ctx.lineWidth = 3;
                this.ctx.strokeStyle = '#00d2ff';
                this.ctx.shadowBlur = 10;
                this.ctx.shadowColor = '#00d2ff';

                if (this.state.symmetry) {
                    const points = this.state.symmetryPoints;
                    const angleStep = (Math.PI * 2) / points;

                    const relX = x - centerX;
                    const relY = y - centerY;
                    const dist = Math.sqrt(relX * relX + relY * relY);
                    const angle = Math.atan2(relY, relX);

                    for (let i = 0; i < points; i++) {
                        const currentAngle = angle + (i * angleStep);
                        const drawX = centerX + Math.cos(currentAngle) * dist;
                        const drawY = centerY + Math.sin(currentAngle) * dist;

                        this.ctx.beginPath();
                        this.ctx.arc(drawX, drawY, 2, 0, Math.PI * 2);
                        this.ctx.stroke();
                    }
                } else {
                    this.ctx.lineTo(x, y);
                    this.ctx.stroke();
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, y);
                }
            }

            // --- Physics & Pattern Analysis ---

            async processPattern() {
                this.statusBadge.innerText = 'Analyzing...';
                this.statusBadge.style.color = '#ffcc00';

                const modes = this.analyzeGeometry();
                const freq = this.calculateFrequency(modes);
                this.state.calculatedFreq = freq;

                this.animateFrequencyDisplay(freq);
                this.modeIndicator.innerText = `Mode: ${modes.n},${modes.m} (Radial, Angular)`;
                this.btnPlay.disabled = false;
                this.statusBadge.innerText = 'Calculated';
                this.statusBadge.style.color = '#00fff2';

                this.updateSpectrum(freq);
            }

            analyzeGeometry() {
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height).data;
                let pixelCount = 0;
                let centerX = this.canvas.width / 2;
                let centerY = this.canvas.height / 2;
                let radialDistSum = 0;

                for (let i = 0; i < imageData.length; i += 400) {
                    if (imageData[i + 3] > 50) {
                        pixelCount++;
                        const pixelIdx = i / 4;
                        const x = pixelIdx % this.canvas.width;
                        const y = Math.floor(pixelIdx / this.canvas.width);
                        const dx = x - centerX;
                        const dy = y - centerY;
                        radialDistSum += Math.sqrt(dx * dx + dy * dy);
                    }
                }

                const avgDist = pixelCount > 0 ? radialDistSum / pixelCount : 0;
                const maxRadius = Math.min(this.canvas.width, this.canvas.height) / 2;
                const normalizedDist = avgDist / maxRadius;

                const n = Math.max(1, Math.floor(normalizedDist * 6) + 1);
                const m = this.state.symmetry ? this.state.symmetryPoints : 2;

                return { n, m };
            }

            calculateFrequency(modes) {
                const materialConstants = {
                    brass: { speed: 3500 },
                    steel: { speed: 5000 },
                    water: { speed: 1480 },
                    rubber: { speed: 60 }
                };

                const mat = materialConstants[this.state.material];
                const L = (this.state.plateSize / 100) || 0.5;
                const modeFactor = Math.sqrt(Math.pow(modes.n, 1.5) + Math.pow(modes.m, 1.2));
                let freq = (modeFactor * mat.speed) / (2 * L);

                const minFreq = 40;
                const maxFreq = 4000;
                freq = Math.min(maxFreq, Math.max(minFreq, freq));

                return parseFloat(freq.toFixed(2));
            }

            // --- Audio Logic ---

            initAudioContext() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            togglePlayback() {
                this.initAudioContext();
                if (this.state.isPlaying) {
                    this.stopTone();
                } else {
                    this.playTone();
                }
            }

            playTone() {
                if (!this.state.calculatedFreq) return;

                this.oscillator = this.audioCtx.createOscillator();
                this.gainNode = this.audioCtx.createGain();

                this.oscillator.type = 'sine';
                this.oscillator.frequency.setValueAtTime(this.state.calculatedFreq, this.audioCtx.currentTime);

                this.gainNode.gain.setValueAtTime(0, this.audioCtx.currentTime);
                this.gainNode.gain.linearRampToValueAtTime(0.2, this.audioCtx.currentTime + 0.1);

                this.oscillator.connect(this.gainNode);
                this.gainNode.connect(this.audioCtx.destination);

                this.oscillator.start();
                this.state.isPlaying = true;
                this.btnPlay.innerHTML = '<span class="icon">⏹</span> Stop Tone';
            }

            stopTone() {
                if (this.oscillator) {
                    this.gainNode.gain.exponentialRampToValueAtTime(0.0001, this.audioCtx.currentTime + 0.1);
                    this.oscillator.stop(this.audioCtx.currentTime + 0.1);
                    this.state.isPlaying = false;
                    this.btnPlay.innerHTML = '<span class="icon">▶</span> Play Tone';
                }
            }

            animateFrequencyDisplay(target) {
                let current = 0;
                const step = target / 20;
                const timer = setInterval(() => {
                    current += step;
                    if (current >= target) {
                        this.freqDisplay.innerText = target.toFixed(2);
                        clearInterval(timer);
                    } else {
                        this.freqDisplay.innerText = current.toFixed(2);
                    }
                }, 30);
            }

            updateSpectrum(freq) {
                this.spectrumViz.innerHTML = '';
                for (let i = 0; i < 40; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'spectrum-bar';
                    const height = Math.abs(Math.sin((freq * i) / 100)) * 100;
                    bar.style.height = `${height}%`;
                    bar.style.opacity = Math.max(0.2, 1 - (i / 40));
                    this.spectrumViz.appendChild(bar);
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());
            }
        }

        window.addEventListener('load', () => {
            window.app = new CymaticsApp();
        });
    </script>
</body>

</html>
